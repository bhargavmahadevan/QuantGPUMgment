name: GhostLayer CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  shipping-hygiene-and-tests:
    name: Shipping Hygiene & Full Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest numpy scipy torch

      - name: Run Shipping Hygiene Verification Gate
        run: |
          python scripts/verify_shipping_hygiene.py

      - name: Run Full Pytest Suite
        run: |
          pytest tests/ ceo_evidence_engine/test_evidence_suite.py -v
